<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal สรุปรวมทุกโปรเจค</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:   #0F1E3C;
    --blue:   #1D4ED8;
    --teal:   #0F766E;
    --green:  #15803D;
    --amber:  #B45309;
    --red:    #B91C1C;
    --purple: #6D28D9;
    --slate:  #334155;
    --light:  #F1F5F9;
    --border: #E2E8F0;
    --white:  #FFFFFF;
    --card-shadow: 0 2px 12px rgba(15,30,60,.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Sarabun', sans-serif;
    background: #EEF2F8;
    color: var(--navy);
    min-height: 100vh;
  }
  .header {
    background: var(--navy);
    padding: 0 2rem;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,.25);
  }
  .header-title { color: #fff; font-size: 1rem; font-weight: 700; letter-spacing: .04em; }
  .header-sub { color: #94A3B8; font-size: .78rem; margin-top: 1px; }

  .main { padding: 1.25rem; max-width: 1100px; margin: 0 auto; }

  #loading-bar {
    background: #EFF6FF; border-bottom: 2px solid #1D4ED8; padding: 8px 1.5rem;
    font-size: .8rem; color: #1D4ED8; display: flex; align-items: center; gap: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
    margin-top: 1.25rem;
  }
  .project-card {
    background: var(--white); border-radius: 14px;
    padding: 1.25rem 1.4rem; box-shadow: var(--card-shadow);
    border-top: 5px solid transparent;
    transition: transform .15s;
    display: flex; flex-direction: column; gap: .9rem;
  }
  .project-card:hover { transform: translateY(-3px); }
  .project-card.blue   { border-color: var(--blue); }
  .project-card.teal   { border-color: var(--teal); }
  .project-card.purple { border-color: var(--purple); }
  .project-card.amber  { border-color: var(--amber); }

  .project-icon { font-size: 1.6rem; }
  .project-title { font-size: 1rem; font-weight: 700; color: var(--navy); }

  .metric-row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: .8rem; color: var(--slate); border-bottom: 1px dashed var(--border);
    padding-bottom: 6px;
  }
  .metric-row:last-of-type { border-bottom: none; padding-bottom: 0; }
  .metric-label { color: #64748B; }
  .metric-value {
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--navy);
    text-align: right;
  }

  .card-links { display: flex; gap: 8px; margin-top: .3rem; }
  .card-link {
    flex: 1; text-align: center; text-decoration: none;
    font-size: .76rem; font-weight: 600; padding: 7px 10px; border-radius: 8px;
    border: 1.5px solid var(--border); color: var(--slate);
    transition: all .15s;
  }
  .card-link:hover { background: var(--light); }
  .card-link.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .card-link.primary:hover { background: #16264a; }

  .error-note { color: var(--red); font-size: .78rem; }

  .footer-note {
    text-align: center; color: #94A3B8; font-size: .72rem; margin-top: 2rem;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">📁 PORTAL สรุปรวมทุกโปรเจค</div>
    <div class="header-sub">ภาพรวมทุกโปรเจคจากโฟลเดอร์ Google Drive</div>
  </div>
</div>

<div id="loading-bar">
  <span>⏳ กำลังโหลดข้อมูลจากทุกโปรเจค...</span>
  <span id="last-updated" style="margin-left:auto;color:#94A3B8;"></span>
</div>

<div class="main">
  <div class="project-grid" id="project-grid"></div>
  <div class="footer-note">อัพเดทอัตโนมัติทุก 5 นาที · ข้อมูลดึงสดจาก Google Sheets ผ่าน Apps Script</div>
</div>

<script>
// ⚙️ ใส่ URL ของ Apps Script Web App ที่ deploy จากไฟล์ master-summary-appsscript.gs
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyY1w-3cnmRsTIyTYKnFBEgxNjF-kJaE-qjQ0UTFoKgLUsS5qw0vvox3v5xxAsnOC9r/exec";

// ถ้ามีหน้า dashboard เฉพาะของโปรเจคไหนอยู่แล้ว ใส่ลิงก์ไว้ตรงนี้ (key = id ของโปรเจค)
const CUSTOM_DASHBOARDS = {
  'sales-commission': null // เช่น "https://yourdomain.com/sales-dashboard.html"
};

function fmt(n) {
  if (typeof n !== 'number') return n;
  return n.toLocaleString('th-TH', { maximumFractionDigits: 0 });
}

function renderProjects(projects) {
  const grid = document.getElementById('project-grid');
  grid.innerHTML = projects.map(p => {
    if (p.error) {
      return `<div class="project-card">
        <div class="project-title">${p.icon || '⚠️'} ${p.title}</div>
        <div class="error-note">โหลดข้อมูลไม่สำเร็จ: ${p.error}</div>
      </div>`;
    }
    const metricsHtml = p.metrics.map(m => `
      <div class="metric-row">
        <span class="metric-label">${m.label}</span>
        <span class="metric-value">${typeof m.value === 'number' ? fmt(m.value) : m.value} ${m.unit || ''}</span>
      </div>`).join('');

    const dashboardUrl = CUSTOM_DASHBOARDS[p.id] || p.dashboardUrl;
    const linksHtml = `
      <div class="card-links">
        ${dashboardUrl ? `<a class="card-link primary" href="${dashboardUrl}" target="_blank" rel="noopener">📊 ดู Dashboard</a>` : ''}
        <a class="card-link${dashboardUrl ? '' : ' primary'}" href="${p.sheetUrl}" target="_blank" rel="noopener">📄 เปิด Sheet</a>
      </div>`;

    return `<div class="project-card ${p.color}">
      <div>
        <div class="project-icon">${p.icon}</div>
        <div class="project-title">${p.title}</div>
      </div>
      ${metricsHtml}
      ${linksHtml}
    </div>`;
  }).join('');
}

async function loadAll() {
  const loadEl = document.getElementById('loading-bar');
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderProjects(data.projects);
    loadEl.style.display = 'none';
    document.getElementById('last-updated').textContent =
      'อัพเดทล่าสุด: ' + new Date().toLocaleTimeString('th-TH');
  } catch (e) {
    loadEl.innerHTML = `<span style="color:#B91C1C">⚠️ โหลดข้อมูลไม่สำเร็จ: ${e.message}</span>
      <small style="color:#64748B;margin-left:8px;">ตรวจสอบว่าใส่ APPS_SCRIPT_URL ถูกต้อง และ Deploy เป็น "Anyone" แล้ว</small>`;
    console.error(e);
  }
}

loadAll();
setInterval(loadAll, 5 * 60 * 1000);
</script>
</body>
</html>
