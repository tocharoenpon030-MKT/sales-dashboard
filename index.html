<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal สรุปรวมทุกโปรเจค</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:   #0F1E3C;
    --blue:   #1D4ED8;
    --teal:   #0F766E;
    --green:  #15803D;
    --amber:  #B45309;
    --red:    #B91C1C;
    --purple: #6D28D9;
    --slate:  #334155;
    --light:  #F1F5F9;
    --border: #E2E8F0;
    --white:  #FFFFFF;
    --card-shadow: 0 2px 12px rgba(15,30,60,.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Sarabun', sans-serif;
    background: #EEF2F8;
    color: var(--navy);
    min-height: 100vh;
  }
  .header {
    background: var(--navy);
    padding: 0 2rem;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 16px rgba(0,0,0,.25);
  }
  .header-title { color: #fff; font-size: 1rem; font-weight: 700; letter-spacing: .04em; }
  .header-sub { color: #94A3B8; font-size: .78rem; margin-top: 1px; }

  .main { padding: 1.25rem; max-width: 1100px; margin: 0 auto; }

  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 1rem;
    margin-top: 1.25rem;
  }
  .project-card {
    background: var(--white); border-radius: 14px;
    padding: 1.25rem 1.4rem; box-shadow: var(--card-shadow);
    border-top: 5px solid transparent;
    transition: transform .15s;
    display: flex; flex-direction: column; gap: .9rem;
  }
  .project-card:hover { transform: translateY(-3px); }
  .project-card.blue   { border-color: var(--blue); }
  .project-card.teal   { border-color: var(--teal); }
  .project-card.purple { border-color: var(--purple); }
  .project-card.amber  { border-color: var(--amber); }

  /* ── Top: icon + editable name ── */
  .card-top { display: flex; align-items: center; gap: 10px; }
  .project-icon { font-size: 1.5rem; flex-shrink: 0; }
  .project-name-input {
    flex: 1; min-width: 0;
    font-family: 'Sarabun', sans-serif;
    font-size: 1rem; font-weight: 700; color: var(--navy);
    border: none; border-bottom: 1.5px dashed transparent;
    background: transparent; padding: 2px 2px 3px;
    outline: none; width: 100%;
  }
  .project-name-input:hover { border-bottom-color: var(--border); }
  .project-name-input:focus { border-bottom-color: var(--blue); background: #F8FAFC; }

  /* ── Editable date fields ── */
  .date-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .date-field { display: flex; flex-direction: column; gap: 3px; }
  .date-field label {
    font-size: .68rem; color: #64748B; font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .date-input {
    font-family: 'IBM Plex Mono', monospace; font-size: .8rem; color: var(--navy);
    border: 1.5px solid var(--border); border-radius: 8px;
    padding: 6px 8px; outline: none; background: var(--white);
    width: 100%;
  }
  .date-input:hover { border-color: #94A3B8; }
  .date-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(29,78,216,.12); }

  /* ── Computed stats: duration + status ── */
  .stat-row {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--light); border-radius: 10px;
    padding: 8px 12px;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat:last-child { align-items: flex-end; }
  .stat-label { font-size: .68rem; color: #64748B; font-weight: 600; }
  .stat-value {
    font-family: 'IBM Plex Mono', monospace; font-size: .82rem; font-weight: 600; color: var(--navy);
  }
  .status-badge {
    display: inline-block; padding: 3px 12px; border-radius: 20px;
    font-size: .74rem; font-weight: 700;
  }
  .status-none     { background: #E2E8F0; color: #64748B; }
  .status-upcoming { background: #FEF3C7; color: var(--amber); }
  .status-active   { background: #DCFCE7; color: var(--green); }
  .status-done     { background: #DBEAFE; color: var(--blue); }

  /* ── Links: dashboard (left) + sheet (right) ── */
  .card-links { display: flex; gap: 8px; margin-top: .1rem; }
  .card-link {
    flex: 1; text-align: center; text-decoration: none;
    font-size: .76rem; font-weight: 600; padding: 7px 10px; border-radius: 8px;
    border: 1.5px solid var(--border); color: var(--slate);
    transition: all .15s; cursor: pointer;
  }
  .card-link:hover { background: var(--light); }
  .card-link.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .card-link.primary:hover { background: #16264a; }
  .card-link.disabled {
    color: #B0B9C6; border-style: dashed; cursor: not-allowed; background: #F8FAFC;
  }

  .footer-note {
    text-align: center; color: #94A3B8; font-size: .72rem; margin-top: 2rem;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">📁 PORTAL สรุปรวมทุกโปรเจค</div>
    <div class="header-sub">พิมพ์ชื่อ/วันที่โปรเจคได้ในการ์ด — ระยะเวลาและสถานะคำนวณให้อัตโนมัติ</div>
  </div>
</div>

<div class="main">
  <div class="project-grid" id="project-grid"></div>
  <div class="footer-note">
    ข้อมูลที่พิมพ์ในหน้านี้ (ชื่อ/วันที่) จะถูกบันทึกอัตโนมัติไว้ในเบราว์เซอร์นี้เท่านั้น
  </div>
</div>

<script>
// ── ข้อมูลตั้งต้นของแต่ละโปรเจค ──
// dashboardUrl / sheetUrl ตั้งค่าในโค้ด (ไม่ได้แก้ผ่านหน้าเว็บ) — ชื่อ/วันที่แก้ได้ในการ์ด
const PROJECTS_DEFAULT = [
  {
    id: 'sales-commission',
    icon: '💰',
    color: 'blue',
    name: 'ค่าคอมพิเศษเซล (ก.ค.-ส.ค. 2569)',
    start: '2026-07-01',
    end: '2026-08-31',
    dashboardUrl: 'sales-commission-dashboard.html',
    sheetUrl: 'https://docs.google.com/spreadsheets/d/1Hd8GeAGDL1w8D7WHJFHx4Y532W_aBRBJSSf35O7maE8/edit#gid=1310728965'
  },
  {
    id: 'project-2', icon: '📦', color: 'teal',
    name: 'โปรเจคใหม่ 2', start: '', end: '',
    dashboardUrl: null, sheetUrl: null
  },
  {
    id: 'project-3', icon: '📦', color: 'purple',
    name: 'โปรเจคใหม่ 3', start: '', end: '',
    dashboardUrl: null, sheetUrl: null
  },
  {
    id: 'project-4', icon: '📦', color: 'amber',
    name: 'โปรเจคใหม่ 4', start: '', end: '',
    dashboardUrl: null, sheetUrl: null
  },
];

const STORAGE_KEY = 'portal_projects_v1';

function loadState() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch (e) {}
  return PROJECTS_DEFAULT.map(p => ({ ...p, ...(saved[p.id] || {}) }));
}

function saveState() {
  const toSave = {};
  state.forEach(p => { toSave[p.id] = { name: p.name, start: p.start, end: p.end }; });
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave)); } catch (e) {}
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function computeDuration(start, end) {
  if (!start || !end) return '—';
  const s = new Date(start), e = new Date(end);
  const days = Math.round((e - s) / 86400000) + 1;
  if (days <= 0) return '—';
  if (days >= 30) {
    const months = Math.floor(days / 30);
    const rem = days % 30;
    return `${days} วัน (~${months} เดือน${rem ? ' ' + rem + ' วัน' : ''})`;
  }
  return `${days} วัน`;
}

function computeStatus(start, end) {
  if (!start || !end) return { text: 'ยังไม่ระบุวันที่', cls: 'status-none' };
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const s = new Date(start), e = new Date(end);
  if (today < s) return { text: 'ยังไม่เริ่ม', cls: 'status-upcoming' };
  if (today > e) return { text: 'เสร็จสิ้น', cls: 'status-done' };
  return { text: 'กำลังดำเนินการ', cls: 'status-active' };
}

function render() {
  const grid = document.getElementById('project-grid');
  grid.innerHTML = state.map(p => {
    const dur = computeDuration(p.start, p.end);
    const st = computeStatus(p.start, p.end);
    const dashBtn = p.dashboardUrl
      ? `<a class="card-link primary" href="${p.dashboardUrl}" target="_blank" rel="noopener">📊 ดู Dashboard</a>`
      : `<span class="card-link disabled">📊 รอออกแบบ</span>`;
    const sheetBtn = p.sheetUrl
      ? `<a class="card-link" href="${p.sheetUrl}" target="_blank" rel="noopener">📄 เปิด Sheet</a>`
      : `<span class="card-link disabled">📄 ยังไม่มี Sheet</span>`;

    return `<div class="project-card ${p.color}">
      <div class="card-top">
        <div class="project-icon">${p.icon}</div>
        <input class="project-name-input" data-id="${p.id}" data-field="name"
               value="${escapeHtml(p.name)}" placeholder="ชื่อโปรเจค">
      </div>
      <div class="date-grid">
        <div class="date-field">
          <label>เริ่มโปรเจค</label>
          <input type="date" class="date-input" data-id="${p.id}" data-field="start" value="${p.start}">
        </div>
        <div class="date-field">
          <label>สิ้นสุดโปรเจค</label>
          <input type="date" class="date-input" data-id="${p.id}" data-field="end" value="${p.end}">
        </div>
      </div>
      <div class="stat-row">
        <div class="stat">
          <span class="stat-label">รวมระยะเวลา</span>
          <span class="stat-value" id="dur-${p.id}">${dur}</span>
        </div>
        <div class="stat">
          <span class="stat-label">สถานะ</span>
          <span class="status-badge ${st.cls}" id="status-${p.id}">${st.text}</span>
        </div>
      </div>
      <div class="card-links">
        ${dashBtn}
        ${sheetBtn}
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.project-name-input, .date-input').forEach(inp => {
    inp.addEventListener('input', onFieldChange);
  });
}

function onFieldChange(e) {
  const id = e.target.dataset.id;
  const field = e.target.dataset.field;
  const proj = state.find(p => p.id === id);
  if (!proj) return;
  proj[field] = e.target.value;
  saveState();

  if (field === 'start' || field === 'end') {
    document.getElementById('dur-' + id).textContent = computeDuration(proj.start, proj.end);
    const st = computeStatus(proj.start, proj.end);
    const badge = document.getElementById('status-' + id);
    badge.textContent = st.text;
    badge.className = 'status-badge ' + st.cls;
  }
}

let state = loadState();
render();
</script>
</body>
</html>
